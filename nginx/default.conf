server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Block all methods except PUT on notifications.json so credentials are never served.
    # The browser writes settings via PUT; reads come from localStorage on the client side.
    location = /notifications.json {
        limit_except PUT {
            deny all;
        }
        dav_methods PUT;
        create_full_put_path on;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
